<body>
    <div class="flex flex-col w-screen h-dvh overflow-auto text-gray-700 bg-gradient-to-tr from-blue-200 via-indigo-200 to-pink-200">
        <div class="h-[100dvh] overflow-scroll flex justify-center">
            <div class="flex sm:flex-row sm:items-start items-center flex-col p-[5px] mt-6 w-[90%] max-w-[800px]">
                <div class="flex flex-col flex-shrink-0 w-full h-auto sm:h-full">
                    <div class="flex flex-col pb-2 overflow-auto" id="remain-greater-0">
                    </div>
                </div>
            </div>
            <div id="loader" class="w-full h-full fixed top-0 left-0 bg-white opacity-75 z-50">
                <div class="flex justify-center items-center mt-[50vh]">
                    <div class="fas fa-circle-notch fa-spin fa-5x text-violet-600"></div>
                </div>
            </div>
        </div>
</body>
<script>
var debugMode = true;
var isShowMenu = false;
var loader = document.getElementById("loader");

function loader_show() {
    loader.classList.remove('hidden')
}

function loader_hide() {
    loader.classList.add('hidden')
}

async function post(apiName, params) {
    const api = 'https://businesscard.lightmatrix3d.com/api/' + apiName
    // const api = 'http://192.168.0.112:8003/api/' + apiName
    const res = await axios.post(api, params)

    if (debugMode) {
        console.log(api, {
            params: params,
            response: res
        })
    }

    if (res.data[0])
        return JSON.parse(JSON.stringify(res.data[0]));
    else
        return JSON.parse(JSON.stringify(res.data));
}

async function getUserUsage(urlParams) {
    var email = null;
    if (urlParams.get('email'))
        email = urlParams.get('email')
    else
    {
        alert("無法取得會員資訊");

        $('#remain-greater-0').html($('<div>', {
            'class': "relative flex flex-col items-center p-4 mt-5 bg-white rounded-lg cursor-pointer bg-opacity-90 group hover:bg-opacity-100 w-full font-bold"
        }).html("<span class='text-red-500 text-9xl'>404</span><span class='text-3xl mt-3'>NOT FOUND</span>"));
        return;
    }
    loader_show();

    function createUserDiv(userData) {
        function createDiscribe(msg) {
            const disc = $('<h4>', {
                'class': "mt-3 text-lg font-medium"
            });

            disc.html(msg);
            return disc;
        }

        const userDiv = $('<div>', {
            'class': "relative flex flex-col items-start p-4 mt-5 bg-white rounded-lg cursor-pointer bg-opacity-90 group hover:bg-opacity-100 w-full"
        });

        const reflashBtn = $('<div>', {
            class: "text-sm font-bold mt-3 mb-2 w-full flex justify-center items-center bg-blue-200 p-2 rounded-lg",
            click: () => {
                loader_show();

                setTimeout(() => {
                    location.reload();
                }, 300)
            }

        }).html("重新整理" + "<i class='fa-solid fa-rotate ml-2'></i>");

        userDiv.append($('<h1>', { class: "text-3xl font-bold mb-2" }).html("觀看額度"));
        userDiv.append(createDiscribe("會員信箱: " + userData.email));
        userDiv.append(createDiscribe("剩餘次數: " + userData.download_time));
        //userDiv.append(createDiscribe("超量次數: " + userData.bonus_times));
        userDiv.append(reflashBtn);

        var currentTime = new Date().toLocaleString(); 
        userDiv.append($("<span>", { class: "text-sm text-gray-500 w-full text-center" }).html("資料取得時間: " + currentTime));
        
        return userDiv;
    }
    loader_show();

    var userData = null;
        userData = await post("getUserData", { email: email });
        console.log("userData")
        console.log(userData)
    try {
        userData = await post("getUserData", { email: urlParams.get('email') });
        console.log("userData")
        console.log(userData)
        console.log("userData")
        if (!userData)
            return;

        $('#remain-greater-0').html("");
        $('#remain-greater-0').append(createUserDiv(userData.message));
    } catch {
        alert("無法連接伺服器");
        loader_hide();
        return;
    }

    loader_hide();
}

window.onload = async function() {
    const urlParams = new URLSearchParams(window.location.search);

    getUserUsage(urlParams);

    loader_hide();
};

</script>

</html>
