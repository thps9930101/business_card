<script>
var token = null;
var debugMode = true;
var isShowMenu = false;
var loader = document.getElementById("loader");

function loader_show() {
    loader.classList.remove('hidden')
}

function loader_hide() {
    loader.classList.add('hidden')
}

function toggleMenu() {
    document.getElementById('menu').classList.toggle('hidden')
}

function hideMenu() {
    document.getElementById('menu').classList.add('hidden')
}

function menuClick(id) {
    console.log(id)
}

async function post(apiName, params) {
    const api = 'https://businesscard.lightmatrix3d.com/api/' + apiName
    //const api = 'http://192.168.0.112:8000/api/' + apiName
    const res = await axios.post(api, params)

    if (debugMode) {
        console.log(api, {
            params: params,
            response: res
        })
    }

    if (res.data[0])
        return JSON.parse(JSON.stringify(res.data[0]));
    else
        return JSON.parse(JSON.stringify(res.data));
}

async function getUser() {
    loader_show();

    function createUserDiv(userData) {
        function createBtn() {

            const btn = $('<button>', {
                'class': "absolute top-0 right-0 flex items-center justify-center hidden w-5 h-5 mt-3 mr-2 text-gray-500 rounded hover:bg-gray-200 hover:text-gray-700 group-hover:flex",
                click: function() {}
            });
            btn.html("<svg class='w-4 h-4 fill-current' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='currentColor'><path d='M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z' /></svg>");

            return btn;
        }

        function createMark() {
            var state = 'text-yellow-500 bg-yellow-100';
            // var state = 'text-pink-500 bg-pink-100';
            // var state = 'text-green-500 bg-green-100';

            const mark = $('<span>', {
                'class': "flex items-center h-6 px-3 text-xs font-semibold text-pink-500 bg-pink-100 rounded-full"
            });

            mark.html("Design");
            return mark;
        }

        function createDiscribe(msg) {
            const disc = $('<h4>', {
                'class': "mt-2 text-sm font-medium"
            });

            disc.html(msg);
            return disc;
        }

        function createMenuBtn() {
            const menu = $('<div>', {
                'class': "flex items-center justify-end w-full mt-3 text-ms font-medium text-gray-600"
            });

            const btnClass = "flex items-center justify-center sm:w-[100px] w-[75px] h-[35px] p-2 rounded-lg";

            menu.append($('<div>', {
                'class': btnClass + " bg-yellow-200 ml-2"
            }).html("編輯" + "<i class='fa-solid fa-pen-to-square ml-1'></i>").on('click', async function() {
                showEditPriceModal(true);
                $('#editID').text('方案ID：' + userData.id);
                // const id = document.getElementById('id');
                const editName = document.getElementById('editName');
                const editTimes = document.getElementById('editTimes');
                const editPrice = document.getElementById('EditPrice');
                const editBonus = document.getElementById('editBonus');
                id.value = userData.id;
                editName.value = userData.name;
                editTimes.value = userData.times;
                editPrice.value = userData.price;
                editBonus.value = userData.bonus_times;
            }));

            menu.append($('<div>', {
                'class': btnClass + " bg-yellow-200 ml-2"
            }).html("刪除" + "<i class='fa-solid fa-trash ml-1'></i>").on('click', async function() {
                // TODO: 檢查是否確認刪除

                var msg = {};
                msg.title = "是否確認刪除該方案";
                msg.html = "點擊確認按鈕即將刪除<span class='text-red-500 font-bold m-1'>'" +
                    userData.name +
                    "'</span>，是否確認刪除";
                msg.showCancelButton = true
                msg.confirmButtonText = '確認刪除';
                msg.cancelButtonText = '取消';
                msg.reverseButtons = true;
                Swal.fire(msg).then(async (result) => {
                    if (result.isConfirmed) {
                        loader_show();
                        if (!token) {
                            alert('無法取得公司資訊，請重新登入')
                            location.href = 'login.html';
                            return;
                        }

                        const remove = await post("removePrice", {
                            'token': token,
                            'id': userData.id
                        });
                        if (remove.success) {
                            alert(remove.message);
                            location.reload();
                        } else
                            alert(remove.message);
                        loader_hide();
                    }
                });

            }));

            return menu;
        }

        const userDiv = $('<div>', {
            'class': "relative flex flex-col items-start p-4 mt-3 bg-white rounded-lg cursor-pointer bg-opacity-90 group hover:bg-opacity-100",
            click: function() {}
        });

        userDiv.append(createBtn());

        if (userData.hasOwnProperty('state'))
            userDiv.append(createMark());

        // userDiv.append(createDiscribe("方案ID: " + userData.id));
        userDiv.append(createDiscribe("方案名稱: " + userData.name));
        userDiv.append(createDiscribe("點擊次數: " + userData.times));
        userDiv.append(createDiscribe("價格: " + userData.price));
        userDiv.append(createMenuBtn());

        return userDiv;
    }
    loader_show();
    var userData;
    if (!token) {
        alert('無法取得公司資訊，請重新登入')
        location.href = 'login.html';
        return;
    }

    try {
        userData = await post("getPrice", {
          token: token
        });
    } catch {
        alert("無法連接伺服器");
        location.href = 'login.html';
        loader_hide();
        return;
    }

    if(!userData.success)
    {
        alert("無法連接伺服器");
        location.href = 'login.html';
        loader_hide();
        return;
    }

    $('#remain-greater-0').html("");
    userData.message.forEach((item) => {
        $('#remain-greater-0').append(createUserDiv(item));
    })

    $('#remain-greater-0-count').html(userData.message.length);

    loader_hide();
    // $('#addUser').hide();
}

async function addUser() {
    loader_show();

    const priceName = document.getElementById('name');
    const times = document.getElementById('times');
    const price = document.getElementById('price');
    const bonus_times = document.getElementById('bonus');

    if (priceName.value == "" || times.value == "" || price.value == "" || bonus_times.value == "") {
        loader_hide();
        alert("請輸入完整資料!");
        return;
    }

    const params = {
        'token': token,
        'priceName': priceName.value,
        'times': times.value,
        'price': price.value,
        //'bonus_times': bonus_times.value
        'bonus_times': 0
    };
    if (!token) {
        alert('無法取得公司資訊，請重新登入')
        location.href = 'login.html';
        return;
    }

    try {
        const res = await post("addPrice", params);
        if (res.success && res.message.token) {
            var msg = {};
            msg.title = "新建成功";
            // msg.html = "新建成功";
            // msg.confirmButtonText = '前往登入';
            msg.reverseButtons = false;
            Swal.fire(msg).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = 'login.html';
                }
            });
        } else {
            alert(res.message);
            location.reload(); // 刷新页面
        }
    } catch {
        alert("無法連接伺服器");
        loader_hide();
        return;
    }

    loader_hide();
    // $('#addUser').hide();
}

async function editPrice() {
    loader_show();
    const id = document.getElementById('id');
    const priceName = document.getElementById('editName');
    const times = document.getElementById('editTimes');
    const price = document.getElementById('EditPrice');
    const bonus_times = document.getElementById('editBonus');
    if (!token) {
        alert('無法取得公司資訊，請重新登入')
        location.href = 'login.html';
        return;
    }

    if(priceName.value =="" || times.value == "" || price.value == "")
    {
        alert("請輸入完整資料!");
        loader_hide();
        return;
    }

    const params = {
        'token': token,
        'id': id.value,
        'priceName': priceName.value,
        'times': times.value,
        'price': price.value,
        //'bonus_times': bonus_times.value
        'bonus_times': 0
    };
    console.log(params);
    const res = await post("editPrice", params);
    if (res.success) {
        var msg = {};
        msg.title = "修改成功";
        alert(res.message);

        location.reload(); // 刷新页面
    } else {
        alert(res.message);
        location.reload(); // 刷新页面
    }

    loader_hide();
}

window.onload = async function() {
    token = localStorage.getItem("company_token")

    if (!token) {
        alert('無法取得公司資訊，請重新登入')
        location.href = 'login.html';
    }

    // ---

    getUser();

    loader_hide();
};
