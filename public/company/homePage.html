        <buton class="flex items-center justify-center w-8 h-8 ml-6 overflow-hidden rounded-full cursor-pointer" onclick="toggleMenu()">

    <div class="h-[92%] overflow-scroll">

            <div class="flex-grow"></div>

        <div class="modal fade" id="addUser" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">建立會員</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

                <div class="flex flex-col justify-center px-1 min-w-[300px] w-full bg-white rounded-lg">
                <div>
                    <form action="#" method="POST">
                    <div>
                        <label for="account" class="block text-sm font-medium leading-6 text-gray-900">帳號</label>
                        <div class="mt-2">
                        <input id="email" name="account" type="email" autocomplete="account" required class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="請輸入會員email">
                        </div>
                    </div>

                    <div hidden>
                        <div class="flex items-center justify-between">
                        <label for="password" class="block text-sm font-medium leading-6 text-gray-900">密碼</label>
                        <div class="text-sm">
                            <!-- <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Forgot password?</a> -->
                        </div>
                        </div>
                        <div class="mt-2">
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" value="!123456">
                        </div>
                    </div>
                    </form>
                </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addUser()" data-dismiss="modal">新增會員</button>
            </div>
            </div>
        </div>
        </div>

        <div class="modal fade" id="editTimes" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true"" data-backdrop="static" data-keyboard="false">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editTimes_Title">編輯剩餘次數</h5>
                </div>
                <div class="modal-body">
                    <div class="text-gray-500 flex items-center">
                        <span class="w-[40%]">目前剩餘次數: </span>
                        <span id="editTimes_originalTimes"></span>
                    </div>
                    <div class="flex mt-2 items-center">
                        <span class="w-[40%]">變更後的剩餘次數: </span>                      
                        <input id="editTimes_input" name="editTimes_input" type="number" class="rounded-lg focus:ring-primary-600 focus:border-primary-600 block flex-grow p-2.5">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="editTimes_btn">保存編輯</button>
                </div>
                </div>
            </div>
        </div>
    
        <div class="modal fade" id="addTimes" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
            <div class="modal-header">

                <span aria-hidden="true">&times;</span>
                </button>

            </div>

                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="addPlanBtn" data-dismiss="modal">添加方案</button>
            </div>

        <div class="modal fade" id="updatePswModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">變更密碼</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                <div class="mt-2">
                    <label for="old_password" class="block text-sm font-medium leading-6 text-gray-900">
                        舊密碼
                        <span class="text-red-500">*<span>
                        <span id="old_password_alert" class="text-red-500 hidden"><span>
                    </label>
                    <div class="mt-2">
                    <input id="old_password" name="old_password" type="password" autocomplete="account" required class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="請輸入舊密碼">
                    </div>
                </div>

                <div class="mt-2">
                    <label for="new_password" class="block text-sm font-medium leading-6 text-gray-900">
                        新密碼
                        <span class="text-red-500">*<span>
                        <span id="new_password_alert" class="text-red-500 hidden"><span>
                    </label>
                    <div class="mt-2">
                    <input id="new_password" name="new_password" type="password" autocomplete="account" required class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="請輸入舊密碼">
                    </div>
                </div>

                <div class="mt-2">
                    <label for="new_password_confirm" class="block text-sm font-medium leading-6 text-gray-900">
                        確認密碼
                        <span class="text-red-500">*<span>
                        <span id="new_password_confirm_alert" class="text-red-500 hidden"><span>
                    </label>
                    <div class="mt-2">
                    <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="account" required class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="請再次輸入密碼">
                    </div>
                </div>

                <div class="mt-2 flex items-center justify-end h-5">
                    <input type="checkbox" id="showPsw" class="mr-1" onchange="togglePassword()">顯示密碼
                </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="updatePswBtn" onclick="updatePassword()">變更密碼</button>
            </div>
            </div>
        </div>
        </div>

        <div class="modal fade modal-fullscreen" id="fullscreenModal" tabindex="-1" aria-labelledby="fullscreenModalLabel" aria-hidden="true">
            <div class="modal-dialog h-[100dvh] !max-w-[70vw]">
            <div class="modal-content h-full">
                <div class="modal-header">
                <h5 class="modal-title" id="fullscreenModalLabel">模型預覽</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body flex-grow">
                <iframe id="previewIframe" src="https://example.com" style="width: 100%; height: 100%; border: none;"></iframe>
                </div>
                <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closePreviewModelModal()">關閉</button>
                </div>
            </div>
            </div>
        </div>
        
        <div class="modal fade" id="addCard" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true" data-backdrop="static" data-keyboard="false">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content w-[80vw]">
                    <div class="modal-header">
                        <h5 class="modal-title text-2xl font-bold" id="exampleModalLongTitle">建立名片</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div class="modal-body flex">
                        <div class="flex flex-col justify-center px-1 min-w-[300px] w-full bg-white rounded-lg">
                            <div class="flex flex-col justify-between border border-blue-500 rounded-lg p-2">

                                <div class="text-xl font-bold mb-[10px]">會員資訊</div>
                                <div class="form-group">
                                    <label for="name">名稱
                                        <span class="text-red-500">*<span>
                                        <span id="name_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="name" type="text" class="form-control" placeholder="請輸入使用者名稱">
                                </div>
                                <div class="form-group">
                                    <label for="account">電子郵件
                                        <span class="text-red-500">*<span>
                                        <span id="email_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="account" type="email" class="form-control" placeholder="請輸入電子郵件">
                                </div>
                                <div class="form-group">
                                    <label for="phone">電話</label>
                                    <span class="text-red-500">*<span>
                                    <input id="phone" type="text" class="form-control" placeholder="請輸入電話">
                                </div>
                            </div>
                        
                            <div class="flex flex-col justify-between border border-blue-500 rounded-lg p-2 mt-2 h-full">

                                <div class="text-xl font-bold mb-[10px]">名片資訊</div>
                                <div class="form-group">
                                    <label for="release_name">發布名稱
                                        <span class="text-red-500">*<span>
                                        <span id="release_name_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="release_name" type="text" class="form-control" placeholder="請輸入名片發布名稱">
                                </div>
                                <div class="form-group">
                                    <label for="line">line</label>
                                    <input id="line" type="text" class="form-control" placeholder="請輸入line id">
                                </div>
                                <div class="form-group">
                                    <label for="facebook">facebook</label>
                                    <input id="facebook" type="text" class="form-control" placeholder="請輸入facebook連結">
                                </div>
                                <div class="form-group">
                                    <label for="instagram">instagram</label>
                                    <input id="instagram" type="text" class="form-control" placeholder="請輸入instagram連結">
                                </div>
                                <div class="form-group">
                                    <label for="web">自訂連結</label>
                                    <input id="web" type="text" class="form-control" placeholder="請輸入自訂連結">
                                </div>
                                <!-- <div class="form-group flex justify-between items-center p-1">
                                    <label for="is_actived">是否公開名片</label>
                                    <input id="is_actived" type="checkbox" checked readonly>
                                </div> -->
        <!--                      <div class="form-group">
                                    <label for="address">地址</label>
                                    <input id="address" type="text" class="form-control" placeholder="請輸入地址">
                                </div> -->
    <!--                             <div class="form-group">
                                    <label for="fax">傳真</label>
                                    <input id="fax" type="text" class="form-control" placeholder="請輸入傳真">
                                </div> -->

                            </div>
                        </div>
                        <div class="flex flex-col justify-start px-1 min-w-[300px] w-full bg-white rounded-lg">
                            <div class="w-full border border-blue-500 rounded-lg p-2">
                                <div class="text-xl font-bold mb-[15px] flex items-center justify-between">
                                    <div>名片正反面圖片</div>
                                    <div class="p-2 btn-primary rounded-lg text-sm" onclick="clearCardPic(false)">清空</div>
                                </div>
                                <div class="form-group">
                                    <label for="pic_front">正面圖片(後面)
                                        <span class="text-red-500">*<span>
                                        <span id="pic_front_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="pic_front" type="file" class="form-control p-0" placeholder="請選擇名片正面圖片" accept="image/jpeg,image/png">
                                </div>
                                <div class="form-group">
                                    <label for="pic_back">反面圖片(底部)
                                        <span class="text-red-500">*<span>
                                        <span id="pic_back_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="pic_back" type="file" class="form-control p-0" placeholder="請選擇名片反面圖片" accept="image/jpeg,image/png">
                                </div>
                            </div>
                            <div class="flex-grow m-1"></div>
                            <div class="w-full border border-blue-500 rounded-lg p-2">
                                <div class="text-xl font-bold mb-[15px] flex items-center justify-between">
                                    <div>模型檔案</div>
                                    <div class="p-2 btn-primary rounded-lg text-sm" onclick="clearModel(false)">清空</div>
                                </div>                            <div class="form-group">
                                    <label for="model_mesh">模型檔(*.obj)
                                        <span class="text-red-500">*<span>
                                        <span id="model_mesh_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="model_mesh" type="file" class="form-control p-0" accept=".obj, .fbx">
                                </div>
                                <div class="form-group">
                                    <label for="model_texture">模型貼圖
                                        <span class="text-red-500">*<span>
                                        <span id="model_texture_alert" class="text-red-500 hidden"><span>
                                    </label>
                                    <input id="model_texture" type="file" class="form-control p-0" accept="image/jpeg,image/png">
                                </div>
                                <!--                             
                                <div class="form-group">
                                    <label for="model_texture">全身圖</label>
                                    <input id="model_texture" type="file" class="form-control p-1">

                                    <input id="model_half" type="file" class="form-control p-0" accept="image/jpeg,image/png"> 
                                </div>
                            </div>
                            <div class="flex-grow m-1"></div>


                            <div class="w-full border border-blue-500 rounded-lg p-2">
                                <div class="text-xl font-bold mb-[10px]">選擇方案</div>
                                <div id="planList"></div>

                            </div>


                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="addUser()" data-dismiss="modal">新增名片</button>
                    </div>
                </div>
            </div>

            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content w-[80vw]">

                        <h5 class="modal-title text-2xl font-bold" id="exampleModalLongTitle">編輯名片</h5>

                    </div>

                                    <input id="edit_name" type="text" class="form-control" placeholder="請輸入使用者名稱">

                                <div class="form-group">
                                    <label for="edit_line">line</label>

    async function post(apiName, params) {
        try {
            const api = 'https://businesscard.lightmatrix3d.com/api/' + apiName
            //const api = 'http://192.168.0.112:8000/api/' + apiName
            const res = await axios.post(api, params, config)

            if (debugMode)
            {
                console.log(api, {
                    params: params,
                    response: res
                })
            }

            if (res.data[0])
                return JSON.parse(JSON.stringify(res.data[0]));
            else
                return JSON.parse(JSON.stringify(res.data));
        }
        catch (error) {
            console.log(error)
            if (error.response) {
                if (error.response.status === 415) {
                    alert("無法取得公司資訊，請重新登入");
                    location.href = "login.html";
                } else {
                    console.log("An error occurred:", error.message);
                }
            } else if (error.request) {
                console.log("No response received.");
            } else {
                console.log('Error', error.message);
            }

            loader_hide();
            return null;
        }

    }

            function formatDate(dateStr) {
                const date = new Date(dateStr);
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');

                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

    function checkFileType(id, type, size = 10, name = "") {
        var input = $('#' + id)[0];

        if (!input.files[0]) {
            alert('請選擇完整選擇檔案');
            loader_hide();
            return false;
        }

        const file = input.files[0];
        if (file.size > size * 1024 * 1024) { 
            alert(name + '大小最大限制為: ' + size + 'MB');
            input.value = ''; 
            loader_hide();
            return;
        }

        var fileType = input.files[0].name.split('.').pop().toLowerCase();

        if (Array.isArray(type))
        {
            var matchType = false;
            type.forEach((item) => {
                if (!matchType) {
                    if ((fileType === item.toLowerCase())) 
                        matchType = true;
                }
            })

            if (!matchType) {
                input.classList.remove("border-gray-500");
                input.classList.add("border-red-500");

                input.value = ''; 
                alert('請選擇 ' + type.join(" or ").toUpperCase() + ' 文件！');
                loader_hide();
                return false;
            }
        }
        else
        {
            if (!(fileType === type.toLowerCase())) {

                input.classList.remove("border-gray-500");
                input.classList.add("border-red-500");

                input.value = ''; 
                alert('請選擇 ' + type.toUpperCase() + ' 文件！');
                loader_hide();
                return false;
            }
        }

        input.classList.add("border-gray-500");
        input.classList.remove("border-red-500");
        return true;
    }

    async function updatePassword() {
        const old_password = $("#old_password").val()
        const new_password = $("#new_password").val()
        const new_password_confirm = $("#new_password_confirm").val()
     
        const old_password_alert = $("#old_password_alert")
        const new_password_alert = $("#new_password_alert")
        const new_password_confirm_alert = $("#new_password_confirm_alert")

        old_password_alert.addClass("hidden");
        new_password_alert.addClass("hidden");
        new_password_confirm_alert.addClass("hidden");

        if (old_password == "")
        {
            console.log(old_password)
            old_password_alert.text("內容不可為空")
            old_password_alert.removeClass("hidden");
        }
        if (new_password == "")
        {
            new_password_alert.text("內容不可為空")
            new_password_alert.removeClass("hidden");
        }

        if (new_password_confirm == "")
        {
            new_password_confirm_alert.text("內容不可為空")
            new_password_confirm_alert.removeClass("hidden");
        }

        if (old_password == "" || new_password == "" || new_password_confirm == "")
            return;

        if (new_password != new_password_confirm)
        {
            new_password_alert.text("密碼輸入不一致")
            new_password_alert.removeClass("hidden");

            new_password_confirm_alert.text("密碼輸入不一致")
            new_password_confirm_alert.removeClass("hidden");
            return;
        }
        checkLocalStorage(); // api ok
        const res = await post("companies_UpdatePassword", {
            token: localStorage.getItem("company_token"),
            Password: old_password,
            newPassword: new_password,
        })

        if (!res)
        {
            alert("出現非預期的錯誤無法，變更密碼")
            loaction.reload();
            return;
        }

        if (res.success) {
            alert("密碼變更成功")
            localStorage.setItem("company_token", "");
            location.href = "login.html";
            return;
        }

        alert(res.message);
    }

    async function editCard() {
        loader_show();

            formData.append('id', card_id);

            // else
            //     edit_pic_result = edit_pic_result + createResultDiv("名片反面圖: ", "變更失敗")

        // if (res.success)

        // else

        loader_hide();
