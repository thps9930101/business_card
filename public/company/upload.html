<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Model</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js" integrity="sha512-PJa3oQSLWRB7wHZ7GQ/g+qyv6r4mbuhmiDb8BjSFZ8NZ2a42oTtAq5n0ucWAwcQDlikAtkub+tPVCw4np27WCg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
    #app {
      font-family: Avenir, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-align: center;
      color:white;
    }

    body {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 100vh;
    }

    nav {
      padding: 30px;
    }

    nav a {
      font-weight: bold;
      color: #2c3e50;
    }

    nav a.router-link-exact-active {
      color: #42b983;
    }

    .custom-file-upload{
      color:white;
      background-color: #4b5563;
      padding: 1rem;
      border-radius: 2rem;
      display: block;
      width: 80%;
      margin: auto;
      font-size: 1.4rem;
    }

    .file_btn{
      text-align: left;
      color: black;
      display:none;
    }

    .input_front{
      color: black;
      display: block;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: left;
      /* margin-left: 2rem;  */
    }

    .login-container {
      background-color: rgba(229, 231, 235, 0.8);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 80%;
      height: 94%;
      margin: auto;
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .form-input {
      color:black;
      width: 100%;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.8rem;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 1rem; 
    }

    .form-input:focus {
      border-color: #2563eb;
    }

    .button {
      display: block;
      color: #ffffff;
      border: 0;
      background-color: rgb(113, 128, 150);
    }
  </style>
</head>

<body class="h-dvh w-full bg-gradient-to-tr from-blue-200 via-indigo-200 to-pink-200 flex items-center justify-center">
  <div>
    <div class="flex flex-col justify-center px-6 py-12 lg:px-8 w-[80%] min-w-[300px] w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-lg">
      <form id="loginForm" class="space-y-4" method="get">
        <div>
          <img src="Logo01-1.png" style="width: 100%;">
          <label for="username" class="input_front mt-5 mb-5">請輸入使用者帳號：</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="使用者帳號">
        </div>
        <div>
          <label for="meshToUpload" class="custom-file-upload flex w-full h-12 justify-center items-center rounded-md bg-indigo-600 px-3 py-1.5 text-2xl font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
            id="meshLabel">
            <i class="fas fa-cloud-upload-alt"></i> 選擇模型
          </label>
          <input type="file" name="meshToUpload" id="meshToUpload" class="file_btn" accept=".obj" onclick="getMesh()">
        </div>
        <div>
          <label for="textureToUpload" class="custom-file-upload flex w-full h-12 justify-center items-center rounded-md bg-indigo-600 px-3 py-1.5 text-2xl font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
            id="textureLabel">
            <i class="fas fa-cloud-upload-alt"></i> 選擇模型圖片
          </label>
          <input type="file" name="textureToUpload" accept="image/jpeg, image/png, image/gif" id="textureToUpload" style="display:none;"
            onclick="getTexture()">
        </div>
        <div>
          <label for="coverToUpload" class="custom-file-upload flex w-full h-12 justify-center items-center rounded-md bg-indigo-600 px-3 py-1.5 text-2xl font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
            id="coverLabel">
            <i class="fas fa-cloud-upload-alt"></i> 選擇全身圖片
          </label>
          <input type="file" name="coverToUpload" accept="image/jpeg, image/png, image/gif" id="coverToUpload" style="display:none;"
            onclick="getCover()">
        </div>
        <div>
          <label for="coverhalfToUpload" class="custom-file-upload flex w-full h-12 justify-center items-center rounded-md bg-indigo-600 px-3 py-1.5 text-2xl font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
            id="coverhalfLabel">
            <i class="fas fa-cloud-upload-alt"></i> 選擇半身圖片
          </label>
          <input type="file" name="coverhalfToUpload" accept="image/jpeg, image/png, image/gif" id="coverhalfToUpload" style="display:none;"
            onclick="getCoverHalf()">
        </div>
        <div>
          <button type="button" id="uploadBtn" class="button flex w-full h-12 justify-center items-center rounded-md px-3 py-1.5 text-2xl font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
            onclick="fetchData()">上傳模型</button>
        </div>
      </form>
    </div>
  </div>
  <div id="logoutButtonContainer" class="absolute top-5 right-5 text-2xl">
    <button id="logoutButton" class="p-2" onclick="Logout()"><i class="fa-solid fa-right-to-bracket"></i></button>
  </div>
    <div id="loader" class="w-full h-full fixed top-0 left-0 bg-white opacity-75 z-50">
      <div class="flex justify-center items-center mt-[50vh]">
        <div class="fas fa-circle-notch fa-spin fa-5x text-violet-600"></div>
      </div>
    </div>
  <script>
    var loader = document.getElementById("loader");
    function loader_show() {
        loader.classList.remove('hidden')
    }

    function loader_hide() {
        loader.classList.add('hidden')
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    window.onload = () => {
          
      var cookieExists = getCookie('account');
      if (!cookieExists) {
          window.location.href = 'login.html';
          alert("請先登入");
      }
      const uploadbtn = document.getElementById('uploadBtn');
      uploadbtn.disabled = true;

      loader_hide();
    }
    

    function getMesh() {
      // Your JavaScript for getting mesh goes here
      const fileInput = document.getElementById('meshToUpload');
      const fileInput2 = document.getElementById('textureToUpload');
      const fileInput3 = document.getElementById('coverToUpload');
      const fileInput4 = document.getElementById('coverhalfToUpload');

      const uploadbtn = document.getElementById('uploadBtn');

      const meshLabel = document.getElementById('meshLabel');

      fileInput.addEventListener('change', function() {
          const selectedFile = this.files[0];
          const fileName = selectedFile.name;
          var fileType = fileName.split('.').pop().toLowerCase();

          if (fileType === 'obj') {
            console.log(fileName);
          } else {
            fileInput.value = ''; 
            alert('請選擇 OBJ 文件！');
            return;
          }

          fileInput.disabled = true;
          meshLabel.style.backgroundColor = '#718096';
          meshLabel.innerText = fileName;

          if(this.files.length>0 && fileInput2.files.length>0&& fileInput3.files.length>0&& fileInput4.files.length>0)
          {
            uploadbtn.disabled = false;
            uploadbtn.style.backgroundColor = '#4f46e5';
          }
      });
    }

    function getTexture() {
      // Your JavaScript for getting texture goes here
       const fileInput = document.getElementById('textureToUpload');
      const fileInput2 = document.getElementById('meshToUpload');
      const fileInput3 = document.getElementById('coverToUpload');
      const fileInput4 = document.getElementById('coverhalfToUpload');

      const uploadbtn = document.getElementById('uploadBtn');

      const meshLabel = document.getElementById('textureLabel');

      fileInput.addEventListener('change', function() {
          const selectedFile = this.files[0];
          const fileName = selectedFile.name;
          const fileType = selectedFile.type.toLowerCase();


          // 检查文件类型是否符合要求
          if (!['image/jpeg', 'image/png', 'image/gif'].includes(fileType)) {
            alert('請選擇 JPEG、PNG 或 GIF 格式的團片文件！');
            // 清空文件选择框中的文件
            fileInput.value = '';
            return;
          }
          fileInput.disabled = true;
          meshLabel.style.backgroundColor = '#718096';
          meshLabel.innerText = fileName;

          if(this.files.length>0 && fileInput2.files.length>0&& fileInput3.files.length>0&& fileInput4.files.length>0)
          {
            uploadbtn.disabled = false;
            uploadbtn.style.backgroundColor = '#4f46e5';
          }
      });
    }

    function getCover() {
      // Your JavaScript for getting cover goes here
      const fileInput = document.getElementById('coverToUpload');
      const fileInput2 = document.getElementById('textureToUpload');
      const fileInput3 = document.getElementById('meshToUpload');
      const fileInput4 = document.getElementById('coverhalfToUpload');

      const uploadbtn = document.getElementById('uploadBtn');

      const meshLabel = document.getElementById('coverLabel');

      fileInput.addEventListener('change', function() {
          const selectedFile = this.files[0];
          const fileName = selectedFile.name;
          const fileType = selectedFile.type.toLowerCase();


          // 检查文件类型是否符合要求
          if (!['image/jpeg', 'image/png', 'image/gif'].includes(fileType)) {
            alert('請選擇 JPEG、PNG 或 GIF 格式的團片文件！');
            // 清空文件选择框中的文件
            fileInput.value = '';
            return;
          }
          fileInput.disabled = true;
          meshLabel.style.backgroundColor = '#718096';
          meshLabel.innerText = fileName;

          if(this.files.length>0 && fileInput2.files.length>0&& fileInput3.files.length>0&& fileInput4.files.length>0)
          {
            uploadbtn.disabled = false;
            uploadbtn.style.backgroundColor = '#4f46e5';
          }
      });
    }

    function getCoverHalf() {
      // Your JavaScript for getting cover half goes here
      const fileInput = document.getElementById('coverhalfToUpload');
      const fileInput2 = document.getElementById('textureToUpload');
      const fileInput3 = document.getElementById('meshToUpload');
      const fileInput4 = document.getElementById('coverToUpload');

      const uploadbtn = document.getElementById('uploadBtn');

      const meshLabel = document.getElementById('coverhalfLabel');

      fileInput.addEventListener('change', function() {
          const selectedFile = this.files[0];
          const fileName = selectedFile.name;
          const fileType = selectedFile.type.toLowerCase();


          // 检查文件类型是否符合要求
          if (!['image/jpeg', 'image/png', 'image/gif'].includes(fileType)) {
            alert('請選擇 JPEG、PNG 或 GIF 格式的團片文件！');
            // 清空文件选择框中的文件
            fileInput.value = '';
            return;
          }
          fileInput.disabled = true;
          meshLabel.style.backgroundColor = '#718096';
          meshLabel.innerText = fileName;

          if(this.files.length>0 && fileInput2.files.length>0&& fileInput3.files.length>0&& fileInput4.files.length>0)
          {
            uploadbtn.disabled = false;
            uploadbtn.style.backgroundColor = '#4f46e5';
          }
      });
    }

    function fetchData() {
      // Your JavaScript for fetching data goes here

      
      const usernameInput = document.getElementById('username');
      const username = usernameInput.value;

      if(username == "")
      {
        alert("請輸入帳號");
        return;
      }

      const meshInput = document.getElementById('meshToUpload');
      const meshfile = meshInput.files[0];

      const textureInput = document.getElementById('textureToUpload');
      const texturefile = textureInput.files[0];

      const coverInput = document.getElementById('coverToUpload');
      const coverfile = coverInput.files[0];

      const coverhalfInput = document.getElementById('coverhalfToUpload');
      const coverhalffile = coverInput.files[0];

      if(meshInput.files.length === 0&&textureInput.files.length === 0&&coverInput.files.length === 0&&coverhalfInput.files.length === 0)
      {
        alert("請輸入模型與圖片");
        return;
      }
      loader_show();
      axios.post('https://businesscard2.lightmatrix3d.com/api/addModels', {
        user_account: username,
        pic_url: meshfile,
        mesh_url: meshfile,
        texture_url: texturefile,
        cover_url: coverfile,
        cover_half_url: coverhalffile

      },
      {
        headers: {
            'Content-Type': 'multipart/form-data'
        }
      })
      .then(response => {
        if(response.data.success)
        {
          alert("上傳成功");
          window.location.href = 'upload.html';

        }
        console.log(response.data);
        loader_hide();
      })
      .catch(error => {
        alert('上傳失敗:', error);
        loader_hide();
      });
    }

    function Logout() {
      document.cookie = 'account=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; ';
      window.location.href = 'login.html';
    }
  </script>
</body>

</html>
